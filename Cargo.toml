[package]
name = "paragon-clicker-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.38", features = ["full"] }
url = "2.5"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_Media"] }
eframe = "0.28"
rustsat = "0.7.5"
rustsat-batsat = "0.7.5"
once_cell = "1.21.4"
minilp = "0.2.2"
mimalloc = { version = "0.1", default-features = false }
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
